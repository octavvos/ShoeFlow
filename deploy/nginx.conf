# /etc/nginx/sites-available/shoeflow — server-setup.sh __DOMAIN__ va __APP_DIR__'ni almashtiradi.
# HTTPS'ni certbot qo'shadi: certbot --nginx -d __DOMAIN__
server {
    listen 80;
    server_name __DOMAIN__;

    client_max_body_size 10m;

    location /static/ {
        alias __APP_DIR__/data/static/;
        expires 7d;
        access_log off;
    }

    location /media/ {
        alias __APP_DIR__/data/media/;
        expires 7d;
    }

    # Frontend (React) — GitHub Actions build qiladi, deploy.sh shu papkaga qo'yadi
    root __APP_DIR__/data/frontend;

    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
    }

    # Vite fayl nomlariga hash qo'shadi — uzoq keshlash xavfsiz
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Django: API, admin panel, health check
    location ~ ^/(api|admin|health)(/|$) {
        proxy_pass http://127.0.0.1:__WEB_PORT__;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
