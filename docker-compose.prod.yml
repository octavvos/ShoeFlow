# Yengil prod stack: reverse proxy (nginx) va HTTPS — host serverda (deploy/nginx.conf).
# Kichik VPS uchun: gunicorn 2 worker, Celery worker va beat bitta jarayonda.
x-app: &app
  build: .
  image: shoeflow:latest
  env_file: .env
  restart: unless-stopped
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy

services:
  db:
    image: postgres:16-alpine
    command: postgres -c shared_buffers=64MB -c max_connections=40
    env_file: .env
    restart: unless-stopped
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  web:
    <<: *app
    command: >-
      sh -c "python manage.py migrate --noinput
      && python manage.py collectstatic --noinput -v0
      && gunicorn config.wsgi:application --bind 0.0.0.0:8000
      --workers $${GUNICORN_WORKERS:-2} --access-logfile -"
    ports:
      # Faqat localhost — tashqaridan faqat nginx orqali
      - "127.0.0.1:${WEB_PORT:-8010}:8000"
    volumes:
      # nginx static va media'ni to'g'ridan-to'g'ri shu papkalardan beradi
      - ./data/static:/app/staticfiles
      - ./data/media:/app/media
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health/')\""]
      interval: 10s
      start_period: 30s
      retries: 5

  celery:
    <<: *app
    # -B: beat shu jarayon ichida; solo pool — alohida child jarayonsiz, xotirani tejaydi
    command: celery -A config worker -B --pool solo -l info --schedule /tmp/celerybeat-schedule

volumes:
  pg_data:
  redis_data:
