name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: shoeflow
          POSTGRES_USER: shoeflow
          POSTGRES_PASSWORD: shoeflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U shoeflow"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DJANGO_SETTINGS_MODULE: config.settings.test
      DATABASE_URL: postgres://shoeflow:shoeflow@localhost:5432/shoeflow

    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Bog'liqliklarni o'rnatish
        run: uv sync --frozen

      - name: Lint
        run: |
          uv run ruff check .
          uv run ruff format --check .

      - name: Migratsiyalar tekshiruvi
        run: uv run python manage.py makemigrations --check --dry-run

      - name: Testlar
        run: uv run pytest --cov --cov-report=term-missing

  deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency: deploy
    env:
      # Secrets kiritilmagan bo'lsa, deploy o'tkazib yuboriladi
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}

    steps:
      - name: Serverga deploy
        if: env.DEPLOY_HOST != ''
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/id_ed25519
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/id_ed25519
          ssh "$DEPLOY_USER@$DEPLOY_HOST" /opt/shoeflow/deploy/deploy.sh
